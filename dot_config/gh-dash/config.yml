prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Mentioned
    filters: reason:mention
  - title: CI Failed
    filters: reason:ci-activity
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: false
    width: 0.75
    height: 0.6
    position: auto
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: L
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    # Review a PR in an ISOLATED workmux worktree — never switches the main
    # clone's branch. `add --pr` checks the PR out into its own worktree+window
    # (-C: no auto-launched agent, -o: reopen if it already exists); `run`
    # launches tuicr in it; quitting tuicr runs `workmux remove`, which prompts
    # before deleting and refuses if you left uncommitted changes. Requires
    # gh-dash running inside tmux and the repo cloned at RepoPath (see below).
    - key: T
      name: review (tuicr, worktree)
      command: >
        cd {{.RepoPath}} &&
        workmux add --pr {{.PrNumber}} --name pr-{{.PrNumber}} -C -o &&
        workmux run pr-{{.PrNumber}} -b -- zsh -ic "tuicr pr {{.PrNumber}}; workmux remove"
    # Same isolated-worktree approach as T, for addressing feedback on your own
    # PRs. No auto-cleanup here: octo is an iterative loop (reply, fix code,
    # push, come back), so the worktree persists — remove it deliberately with
    # `workmux remove` (or `workmux merge` when the PR lands).
    - key: O
      name: review (octo.nvim, worktree)
      command: >
        cd {{.RepoPath}} &&
        workmux add --pr {{.PrNumber}} --name pr-{{.PrNumber}} -C -o &&
        workmux run pr-{{.PrNumber}} -b -- zsh -ic "nvim -c 'Octo pr edit {{.PrNumber}}'"
repoPaths:
  ":owner/:repo": "~/Projects/:owner/:repo"
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: true
pager:
  diff: ""
confirmQuit: true
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
