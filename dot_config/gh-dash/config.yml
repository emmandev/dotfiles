prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Mentioned
    filters: reason:mention
  - title: CI Failed
    filters: reason:ci-activity
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: false
    width: 0.75
    height: 0.6
    position: auto
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      labels:
        width: 22
        hidden: true
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: L
      name: lazygit
      command: >
        cd {{.RepoPath}} && lazygit
  prs:
    # Open the selected PR in a new tmux window: check out the branch, then
    # launch the review TUI. Requires gh-dash to be running inside tmux and
    # the repo cloned at RepoPath (see repoPaths catch-all below).
    - key: T
      name: review (tuicr)
      command: >
        tmux new-window -c {{.RepoPath}} -n pr-{{.PrNumber}}
        "gh pr checkout {{.PrNumber}} && tuicr pr {{.PrNumber}}"
    - key: O
      name: review (octo.nvim)
      command: >
        tmux new-window -c {{.RepoPath}} -n pr-{{.PrNumber}}
        "gh pr checkout {{.PrNumber}} && nvim -c 'Octo pr edit {{.PrNumber}}'"
repoPaths:
  ":owner/:repo": "~/Projects/:owner/:repo"
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: true
pager:
  diff: ""
confirmQuit: true
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
